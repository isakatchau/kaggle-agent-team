[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kagent"
version = "0.1.0"
description = "A multi-agent team that autonomously enters Kaggle tabular competitions."
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.16",
  "openai==3.35.1",
  "pydantic==2.14.1",
  "PyYAML==6.0.3",
  "python-dotenv==1.2.4",
  "pandas==3.0.6",
  "numpy==2.5.4",
  "scikit-learn==1.9.1",
  "lightgbm==4.7.0",
  "joblib==1.6.0",
  "matplotlib==3.11.2",
  "kaggle==2.2.4",
  "truststore==0.10.5",
]

[project.optional-dependencies]
dashboard = ["streamlit==1.66.0"]
dev = ["pytest==9.1.1", "pytest-playwright==0.10.0"]

[project.scripts]
kagent = "kagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = ["e2e: browser tests of the dashboard (make e2e)"]
